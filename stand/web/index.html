<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Skydysh stand</title>
<style>html, body { margin: 0; background: #000; } canvas { display: block; }</style>
</head>
<body>
<canvas id="c"></canvas>
<script src="gfx.js"></script>
<script>
// index.html?frame=<frame.json>&flat=<flat.png>[&hud=<hud.png>]&scale=4[&q=2] draws one frame the stand wrote out
// (q: drawn pixels to a frame pixel, as on the phone)
(async () => {
  const q = new URLSearchParams(location.search);
  try {
    const frame = await (await fetch(q.get('frame'))).json();
    const img = new Image();
    img.src = q.get('flat');
    await img.decode();
    // the fine layer over the top, if the frame has one
    let hud = null;
    if (frame.hudRows > 0 && q.get('hud')) {
      hud = new Image();
      hud.src = q.get('hud');
      await hud.decode();
    }
    // the sheet of buttons and signs, written once next to the frames
    let badges = null;
    if (frame.badgeN > 0) {
      badges = new Image();
      badges.src = q.get('frame').replace(/[^/]*$/, 'badges.png');
      await badges.decode();
    }
    await render(document.getElementById('c'), frame, img, +(q.get('scale') || 4), q.get('shaders') || '../../assets/shaders/', hud, +(q.get('q') || 2), badges);
    window.DONE = 'ok';
  } catch (e) {
    window.DONE = 'error: ' + e.message;
  }
})();
</script>
</body>
</html>
